services:
  - type: web
    name: proyecto-universidad-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Origen del contenido real (subdominio DISTINTO al que sirve el proxy,
      # para no crear un bucle). El proxy se publica en clase.alexandramarin.co
      # y lee el contenido desde origen.alexandramarin.co (-> Vercel).
      - key: TARGET
        value: https://origen.alexandramarin.co
      # Latencia de carga de la pagina (ms). 0 = sin retraso.
      - key: SERVER_DELAY_MS
        value: "0"
      # Duracion del overlay "Cargando..." al enviar el formulario (ms).
      - key: FORM_DELAY_MS
        value: "30000"
